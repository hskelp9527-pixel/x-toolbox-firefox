<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X 随手箱</title><link rel="stylesheet" href="panel.css"></head><body>
<div id="grip" aria-hidden="true"></div><header><strong>随手箱 <small id="owner">三合一</small></strong><div><button id="expand" class="icon" aria-label="展开更多 / 恢复">↕</button><button id="close" class="icon" aria-label="收起工具">⌄</button></div></header>
<nav role="tablist" aria-label="工具"><button role="tab" data-tab="schedule" aria-selected="true" aria-controls="schedule">◷ 发稿</button><button role="tab" data-tab="progress" aria-selected="false" aria-controls="progress">◉ 进度</button><button role="tab" data-tab="mentions" aria-selected="false" aria-controls="mentions">@ 记得</button></nav>
<main>
<section id="schedule" role="tabpanel"><div class="section-top"><small id="schedule-meta">正在读取…</small><button class="icon blue" id="schedule-refresh" aria-label="核对 X 定时列表">↻</button></div><div id="schedule-list"></div><p class="hint" id="schedule-status">定时成功后自动记录，无需手填。</p></section>
<section id="progress" role="tabpanel" hidden><div class="section-top"><small id="progress-meta">今天</small><div><button class="icon" id="goals-toggle" aria-label="设置每日目标和冷却时间">⚙</button><button class="icon blue" id="scan-reset" aria-label="重置今日扫描并重新扫描当前页">↻</button></div></div><div id="rings" class="rings"></div><form id="goals-form" hidden><label>原创<input name="post" type="number" min="1" max="10000" required></label><label>回复<input name="reply" type="number" min="1" max="10000" required></label><label>引用<input name="quote" type="number" min="1" max="10000" required></label><label class="wide">关注限速冷却（分钟）<input name="cooldown" type="number" min="1" max="1440" required></label><button class="primary wide">保存设置</button></form><div id="cooldown" class="hint" hidden></div><div class="follow-summary"><span>未回关 <b id="follow-count">0</b> 人</span><button class="link" id="follow-toggle" aria-expanded="false">查看名单 ›</button></div><div class="follow-controls"><label><input id="highlight" type="checkbox" checked>页面与名单高亮</label><button class="link" id="open-following">打开我的关注页 ↗</button></div><div id="follow-list" hidden></div><p class="hint" id="progress-status">只扫描你已加载的关注页。</p></section>
<section id="mentions" role="tabpanel" hidden><div class="searchline"><input id="search" type="search" placeholder="搜索昵称、@用户名、备注" aria-label="搜索已保存联系人"><button class="link" id="multi">多选</button></div><div id="people"></div><div class="selection" id="selection" hidden><button class="primary" id="insert-selected">加入输入框</button><button class="secondary" id="copy-selected">复制</button></div><div class="mention-tools"><button class="link" id="scan-people">↻ 扫描本页</button><button class="link" id="manual-toggle">＋ 手动添加</button><button class="link" id="data-toggle">备份</button></div><div id="candidates" hidden></div><form id="person-form" hidden><input id="handle" placeholder="@用户名或主页链接" required aria-label="用户名"><input id="display-name" placeholder="昵称（扫描可自动读取）" aria-label="昵称"><input id="note" placeholder="备注（可选）" aria-label="备注"><button class="primary">保存</button></form><div id="data-tools" hidden><button class="secondary" id="export-people">导出联系人</button><button class="secondary" id="import-people">导入旧版联系人</button><input type="file" id="import-file" accept="application/json,.json" hidden></div><p class="hint" id="mention-status">从输入框旁的小 @ 打开，可直接加入原输入框。</p></section>
</main><div class="status" id="status" role="status" hidden></div><script src="panel.js"></script></body></html>
